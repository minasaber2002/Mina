    <script>
      // Safeguard against "Cannot set property fetch of #<Window> which has only a getter"
      // when environment or proxy scripts attempt to wrap or reassign window.fetch.
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : globalThis;
          var initialFetch = target.fetch;
          var currentFetch = typeof initialFetch === 'function' ? initialFetch.bind(target) : initialFetch;

          Object.defineProperty(target, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (!desc || !desc.set || !desc.writable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(newFetch) {
                    currentFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          }
        } catch (e) {}
      })();
    </script>
